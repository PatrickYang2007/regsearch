[project]
name = "regsearch"
version = "0.1.0"
description = "Hybrid retrieval + reranking over regulatory-genomics literature"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "orjson>=3.10",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept separate so the ingestion/retrieval path installs fast on a login node.
embed = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
regsearch = "regsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
