[project]
name = "regsearch"
version = "0.1.0"
description = "Hybrid retrieval + reranking over regulatory-genomics literature"
# Upper bound is deliberate: torch and sentence-transformers have no 3.14
# wheels, and uv otherwise resolves to the newest interpreter on the box.
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "orjson>=3.10",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept separate so the ingestion/retrieval path installs fast on a login node.
embed = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
regsearch = "regsearch.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

# This cluster's GPU nodes run driver 570.211.01 (CUDA 12.8). The default PyPI
# wheel for torch >=2.13 is built against CUDA 13.0 and needs a 580.x driver, so
# it silently falls back to CPU here. Pin the CUDA build, not the version.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
